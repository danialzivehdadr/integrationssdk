        tion: Address of the second token of the pair
          example: utozz-siaaa-aaaam-qaaxq-cai
        createdAtBlockNumber:
          type: integer
          format: int64
          description: Block number when the pair was created
          example: 255592
        createdAtBlockTimestamp:
          type: integer
          format: int64
          description: Timestamp when the pair was created
          example: 1662454363134
        createdAtTxnId:
          type: string
          description: Transaction ID when the pair was created
          example: '0x3e668'
        feeBps:
          type: integer
          description: Fee in basis points
          example: 30
        factoryAddress:
          type: string
          description: Address of the factory that created the pair
          example: 3xwpq-ziaaa-aaaah-qcn4a-cai
      required:
        - id
        - asset0Id
        - asset1Id
        - createdAtBlockNumber
        - createdAtBlockTimestamp
        - createdAtTxnId
        - feeBps
        - factoryAddress
    Exchange:
      type: object
      description: Exchange schema
      properties:
        factoryAddress:
          type: string
          description: Address of the factory
          example: lzvjb-wyaaa-aaaam-qarua-cai
        name:
          type: string
          description: Name of the exchange
          example: BOX DIP-20
        logoURL:
          type: string
          description: URL to the exchange logo
          example: 'https://mydex.com/logo.png'
      required:
        - factoryAddress
        - name
    Event:
      type: object
      description: Event schema
      properties:
        block:
          $ref: '#/components/schemas/Block'
        txnId:
          type: string
          description: Transaction ID
          example: '0x3a78fd'
        txnIndex:
          type: integer
          format: int64
          description: Index of the transaction in the block
          example: 216675
        eventIndex:
          type: integer
          format: int64
          description: Index of the event in the transaction
          example: 216675
        maker:
          type: string
          description: Address of the maker
          example: 'gforl-dm7ty-dstlf-enaa5-xd474-k4tlm-xxfoq-fgg6x-omjk4-te3mv-xqe'
        pairId:
          type: string
          description: Address of the pair
          example: rd6wb-lyaaa-aaaaj-acvla-cai:utozz-siaaa-aaaam-qaaxq-cai
        eventType:
          type: string
          description: Type of the event
          enum:
            - creation
            - swap
            - join
            - exit
          example: swap
        asset0In:
          type: string
          description: Amount of asset0 swapped in
          example: '1.00000000'
        asset1Out:
          type: string
          description: Amount of asset1 swapped out
          example: '0.00604151'
        asset0Out:
          type: string
          description: Amount of asset0 swapped out
          example: '0.00000000'
        asset1In:
          type: string
          description: Amount of asset1 swapped in
          example: '0.00000000'
        amount0:
          type: string
          description: Amount of asset0 involved in join/exit
          example: '19.966298246356'
        amount1:
          type: string
          description: Amount of asset1 involved in join/exit
          example: '1.19089177'
        reserves:
          type: object
          description: Reserves of the pair after the event
          properties:
            asset0:
              type: string
              description: Reserve of asset0
              example: '10049651.98319796'
            asset1:
              type: string
              description: Reserve of asset1
              example: '60897.81801559'
    ResponseOfBlock:
      type: object
      properties:
        block:
          $ref: '#/components/schemas/Block'
    ResponseOfAsset:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
    ResponseOfAssetHolders:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/AssetHolders'
    ResponseOfExchange:
      type: object
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
    ResponseOfPair:
      type: object
      properties:
        pair:
          $ref: '#/components/schemas/Pair'
    ResponseOfEvents:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    ResponseOfError:
      type: array
      items:
        type: object
        properties:
          code:
            type: integer
            example: 400
          message:
            type: string
            example: Invalid parameters
          issues:
            type: array
            items:
              type: object
              properties:
                param:
                  type: string
                  example: number
                code:
                  type: string
                  example: invalid
                message:
                  type: string
                  example: Block number must be an integer value
  responses:
    ErrorNotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseOfError'
          example:
            - code: 404
              message: Not found
    ErrorTooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseOfError'
          example:
            - code: 429
              message: Too many requests
    ErrorInternal:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseOfError'
          example:
            - code: 500
              message: Internal server error
