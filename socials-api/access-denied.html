<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .troll-container {
            border: 2px solid #00ff41;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            max-width: 600px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ff3333;
            text-shadow: 2px 2px 4px #000;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .emoji {
            font-size: 4rem;
            display: block;
            margin: 20px 0;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
        .owner-only {
            color: #ffff00;
            font-weight: bold;
            font-size: 1.4rem;
            border-top: 1px dashed #00ff41;
            padding-top: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="troll-container">
        <span class="emoji">🤡</span>
        <h1>ACCESS DENIED</h1>
        <p>Nice try! But your "hacking" skills are adorable.</p>
        <p>Did you really think it would be this easy?</p>
        
        <div class="owner-only">
            ⚠️ ONLY THE OWNER HAS PERMISSION HERE. ⚠️<br>
            Keep dreaming and go away. 🚫
        </div>
    </div>

    <script>
        // Optional: Log the unauthorized attempt to console
        console.warn("⚠️ Unauthorized access attempt blocked. Only the Owner has permission.");
    </script>
</body>
  </html>
